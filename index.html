<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Administrativo - G&E</title>
    <style>

        :root {
            --primary-blue: #002060;
            --secondary-blue: #003399;
            --accent-yellow: #FFC000;
            --bg-color: #0b1425;
            --text-color: #f1f5fb;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(ellipse at 50% 15%, rgba(35, 57, 83, 0.5), transparent 58%),
                linear-gradient(135deg, #101c30 0%, #081120 55%, #101a2b 100%);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(110deg, #aeb6c2 0%, #d0d4da 50%, #aab3c0 100%);
            width: 100%;
            padding: 10px 0 0;
            text-align: center;
            box-shadow: 0 8px 28px rgba(0,0,0,0.25);
        }

        .logo {
            max-width: 200px;
            width: 70%;
            height: auto;
            mix-blend-mode: multiply;
        }

        .header-line {
            height: 4px;
            background-color: var(--accent-yellow);
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 0 10px rgba(255,192,0,0.35);
        }

        .container {
            max-width: 1000px;
            width: 90%;
            margin: 24px auto;
            text-align: center;
        }

        .page {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .page.active {
            display: block;
        }

        #page-home {
            max-width: 435px;
            width: calc(100% - 36px);
            margin: 22px auto;
            padding: 24px 28px 28px;
            background: linear-gradient(145deg, rgba(24, 39, 61, 0.98), rgba(15, 28, 47, 0.98));
            border: 1px solid rgba(91, 145, 198, 0.9);
            border-right-color: rgba(255, 192, 0, 0.75);
            border-bottom-color: rgba(255, 192, 0, 0.65);
            border-radius: 13px;
            box-shadow: 0 0 22px rgba(26, 108, 173, 0.16), 0 0 24px rgba(255,192,0,0.08);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #f5f7fb;
            margin: 0 0 10px;
            font-size: 1.45rem;
            font-weight: 700;
        }

        p.subtitle {
            color: #aeb9c9;
            margin: 0 0 24px;
            font-size: 0.9em;
        }

        .aviso {
            background-color: rgba(255, 192, 0, 0.1);
            color: #ffe08a;
            padding: 15px;
            border-left: 4px solid var(--accent-yellow);
            border-radius: 6px;
            margin-bottom: 24px;
            font-weight: 600;
            text-align: left;
        }

        .main-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 300px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
            text-align: left;
        }

        .card {
            background: linear-gradient(145deg, #17263b, #111e31);
            padding: 22px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 16px rgba(0,0,0,0.18);
            border: 1px solid rgba(94, 125, 160, 0.25);
            border-top: 3px solid var(--primary-blue);
        }

        .card h3 {
            margin: 0 0 15px;
            color: #e8eef8;
            text-align: center;
        }

        .email-text {
            text-align: center;
            font-size: 1.05em;
            font-weight: bold;
            color: #c6d2e3;
            margin: 10px 0;
